name: Build GUI binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pipx install poetry
      - run: poetry install --with dev
      - name: Stamp version from tag
        run: echo "__version__ = \"${GITHUB_REF_NAME}\"" > ocw/_version.py
      - run: poetry run pyinstaller --onefile --windowed --name ocw-gui ocw/gui/olx.py
      - run: poetry run pyinstaller --onefile --windowed --name ocw-gui-wp ocw/gui/wp.py
      - run: |
          mkdir -p AppDir/usr/bin
          cp dist/ocw-gui AppDir/usr/bin/
          cp packaging/ocw-gui.desktop AppDir/
          cp packaging/ocw-gui.png AppDir/
          ln -s usr/bin/ocw-gui AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir OCW-GUI-x86_64.AppImage
      - run: |
          mkdir -p AppDir-wp/usr/bin
          cp dist/ocw-gui-wp AppDir-wp/usr/bin/
          cp packaging/ocw-gui-wp.desktop AppDir-wp/
          cp packaging/ocw-gui-wp.png AppDir-wp/
          ln -s usr/bin/ocw-gui-wp AppDir-wp/AppRun
          ./appimagetool-x86_64.AppImage AppDir-wp OCW-WP-GUI-x86_64.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            OCW-GUI-x86_64.AppImage
            OCW-WP-GUI-x86_64.AppImage

  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - run: poetry install --with dev
      - name: Stamp version from tag
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME}\"" > ocw/_version.py
      - run: poetry run pyinstaller --onefile --windowed --name ocw-gui ocw/gui/olx.py
      - run: poetry run pyinstaller --onefile --windowed --name ocw-gui-wp ocw/gui/wp.py
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/ocw-gui.exe
            dist/ocw-gui-wp.exe

  moodle-plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/export_plugins.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            filter_vidrouter.zip
            local_vidrouter.zip
