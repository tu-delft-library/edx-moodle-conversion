[project]
name = "ocw"
version = "0.1.0"
description = "OpenEdX OLX → Moodle MBZ converter"
authors = [
    {name = "Kikis", email = "kikispcmr@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = ["python-dotenv>=1.0", "requests>=2.28", "beautifulsoup4>=4.12", "lxml>=5.0"]

[project.scripts]
ocw = "ocw.cli.olx:main"
ocw-wp = "ocw.cli.wp:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-cov = "*"
pyinstaller = "^6.21.0"
deptry = "^0.25.1"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.3"
mkdocstrings = { version = "^0.30.1", extras = ["python"] }
ruff = "^0.14.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff.lint]
select = ["F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
