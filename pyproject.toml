[project]
name = "ocw"
version = "0.1.0"
description = "OpenEdX OLX → Moodle MBZ converter"
authors = [
    {name = "Kikis", email = "kikispcmr@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0"]

[project.scripts]
ocw = "ocw.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-cov = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
